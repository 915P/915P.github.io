name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 授予部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发时取消旧任务，避免部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

# ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26。
# 两个 job 都锁定 ubuntu-24.04，免得那天起构建环境突变；
# 确认迁移无问题后可再改回 ubuntu-latest。
# （注意：runs-on 不读 env 上下文，所以只能直接写死字面量。）

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 构建
        run: npm run build

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
